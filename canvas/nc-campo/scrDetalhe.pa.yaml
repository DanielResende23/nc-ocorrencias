Screens:
  scrDetalhe:
    Properties:
      Fill: =CorFundo
      OnVisible: =Set(gblOcorrenciaSel, LookUp(Ocorrências, Ocorrência = gblOcorrenciaSel.Ocorrência))
    Children:
      - conDetRaiz:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =CorFundo
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conDetTopo:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =CorPrimaria
                  FillPortions: =0
                  Height: =96
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =8
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - btnDetVoltar:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="Voltar"
                        Appearance: =ButtonAppearance.Transparent
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =48
                        Icon: ="ArrowLeft"
                        Layout: =ButtonLayout.IconOnly
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Back()
                        Text: ="Voltar"
                        Width: =48
                  - cmpDetCabecalho:
                      Control: CanvasComponent
                      ComponentName: cmpCabecalho
                      Properties:
                        FillPortions: =1
                        Height: =96
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Subtitulo: =gblOcorrenciaSel.Protocolo
                        Titulo: ="Detalhe da ocorrência"
            - conDetCorpo:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                Children:
                  - cmpDetCard:
                      Control: CanvasComponent
                      ComponentName: cmpCardOcorrencia
                      Properties:
                        Abertura: =Text(gblOcorrenciaSel.'Data de Criação', "dd/mm/yyyy hh:mm")
                        AlignInContainer: =AlignInContainer.Stretch
                        CorSLA: =CorSLA(Text(gblOcorrenciaSel.'Situação do SLA'))
                        CorStatus: =CorStatus(Text(gblOcorrenciaSel.'Status (nc_status)'))
                        Height: =148
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Motivo: =gblOcorrenciaSel.Motivo.'Motivo (nc_name)'
                        Pedido: ="Pedido " & gblOcorrenciaSel.Pedido.'Número do pedido' & " · " & gblOcorrenciaSel.Cliente.'Nome da Conta'
                        Protocolo: =gblOcorrenciaSel.Protocolo
                        SituacaoSLA: =Coalesce(Text(gblOcorrenciaSel.'Situação do SLA'), "Calculando SLA")
                        Status: =Text(gblOcorrenciaSel.'Status (nc_status)')
                  - conDetStatus:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =CorBorda
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =CorSuperficie
                        FillPortions: =0
                        Height: =If(IsBlank(gblOcorrenciaSel.'Resolvida em'), 252, 292)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =14
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =14
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                      Children:
                        - lblDetStatusTitulo:
                            Control: ModernText
                            Properties:
                              Color: =CorTexto
                              Font: =FonteNC
                              FontWeight: =FontWeight.Bold
                              Height: =24
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingTop: =0
                              Size: =16
                              Text: ="Status e prazos"
                              Wrap: =false
